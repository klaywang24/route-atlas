
<script>/* 主题先定死 light/dark（看板同款：图标显隐靠 html[data-theme] 精确匹配，属性必须始终显式；也防 FOUC）。钥匙仍是 fm-theme。 */

/* 日/夜切换＝访客看板同款（2026-08-26 移植，源=访客数据/访客看板.html←klay-site theme-toggle）：
   太阳/月亮图标 + 按下回弹 + 图标旋转 + 圆形揭示。图标显隐靠 html[data-theme] 精确匹配，
   属性由 head 内联脚本保证始终显式写 light/dark。 */
html[data-theme="light"] .icon-sun{display:none}
html[data-theme="dark"] .icon-moon{display:none}
#darkBtn{display:inline-flex;align-items:center;justify-content:center}
#darkBtn svg{transition:transform .2s cubic-bezier(.16,1,.3,1)}

@keyframes icon-swap{from{transform:rotate(-120deg) scale(.5);opacity:.3}to{transform:rotate(0) scale(1);opacity:1}}
/* 圆形揭示：关掉浏览器默认淡入，只留 clip-path 那个圆 */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:0}
::view-transition-new(root){z-index:1}
@media (prefers-reduced-motion:reduce){#darkBtn.spin svg{animation:none}}
